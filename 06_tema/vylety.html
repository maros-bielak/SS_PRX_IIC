<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Výlety po Orave</title>
</head>
<body>
    <h1>Výlety po Orave</h1>
    <p>Krátky ekzkurz po krásach Oravy (trénujeme blokové a inline prvky)</p>
    <div id="karty" style="display: flex; gap: 20px; padding: 10px; flex-wrap:wrap;">

        <div class="karta">
            <h2>Roháče</h2>
            <img src="obrazky/rohace.jpg" alt="Rohačské plesá" width="250">
            <p>Krátky popis výletu</p>
            <ul> <b>Čo si zbaliť:</b>
                <li>Oblečenie 
                    <ul> 
                        <li>Bunda</li> 
                        <li>Čiapka</li> 
                    </ul> 
                </li>
                <li>Jedlo 
                    <ul> 
                        <li>Horalka</li> 
                    </ul> 
                </li> 
            </ul>
        
        </div>

        <div class="karta">
            <h2>Oravský hrad</h2>
            <img src="obrazky/hrad.jfif" alt="Oravský hrad" width="250">
            <p>Krátky popis výletu</p>
        </div>

        <div class="karta">
            <h2>Oravská priehrada</h2>
            <img src="obrazky/priehrada.jfif" alt="Oravská priehrada" width="250">
            <p>Krátky popis výletu</p>
        </div>    

    </div>
</body>
</html>
